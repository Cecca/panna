[project]
name = "pypanna"
version = "0.1.0"
description = "A Playground for Approximate Nearest Neighbors Algorithms"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Matteo Ceccarello", email = "matteo.ceccarello@unipd.it" },
    { name = "Francesco Pio Monaco", email = "francescopio.monaco@unitn.it" },
    { name = "Francesco Silvestri", email = "francesco.silvestri@unipd.it" },
    { name = "Martin Aumüller", email = "maau@itu.dk"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "fast-hdbscan>=0.3.2",
    "h5py>=3.16.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "numba>=0.68.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.urls]
Homepage = "https://github.com/Cecca/panna"
Repository = "https://github.com/Cecca/panna"

[build-system]
requires = ["scikit-build-core >=0.11", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["python/pypanna"]
sdist.exclude = ["notebooks", "scripts", "results", "nix", ".envrc", ".codegraph", ".github", "paper"]

[tool.cibuildwheel]
# The extension uses the stable ABI (cp312-abi3), so one build per platform suffices.
build = "cp312-manylinux_x86_64"
build-verbosity = 1
test-command = "python -c \"import pypanna; print(pypanna.git_version)\""

[tool.cibuildwheel.linux]
# The manylinux image ships an Eigen that is too old (we need >= 3.4).
before-all = """
curl -sSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | tar xz -C /tmp && \
cmake -S /tmp/eigen-3.4.0 -B /tmp/eigen-build -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF && \
cmake --install /tmp/eigen-build
"""
environment-pass = ["GIT_COMMIT_HASH"]
